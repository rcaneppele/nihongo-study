name: Deploy (Cloudflare Pages)

# Publica o app em nihongostudy.app (Cloudflare Pages) a cada push na main,
# depois de o CI passar. Precisa dos segredos CLOUDFLARE_API_TOKEN (permissão
# Account › Cloudflare Pages › Edit) e CLOUDFLARE_ACCOUNT_ID.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  cloudflare:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
        env:
          # Client ID do Google (não é segredo) — variável do repositório, em
          # Settings › Secrets and variables › Actions › Variables.
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}

      # Cria o projeto na primeira vez; se já existe, o erro é ignorado (e um
      # problema de verdade, como o token, aparece no passo seguinte).
      - run: npx --yes wrangler pages project create nihongo-study --production-branch=main || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=nihongo-study --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
